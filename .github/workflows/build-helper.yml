name: Force Terminal macOS arm64

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: force-mac-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      FORCE_RELEASE_MODE: ${{ github.event_name == 'push' && (vars.FORCE_RELEASE_MODE || 'community') || 'adhoc' }}
      FORCE_MACOS_CERT_P12_BASE64: ${{ github.event_name == 'push' && secrets.FORCE_MACOS_CERT_P12_BASE64 || '' }}
      FORCE_MACOS_CERT_PASSWORD: ${{ github.event_name == 'push' && secrets.FORCE_MACOS_CERT_PASSWORD || '' }}
      FORCE_MACOS_SIGNING_IDENTITY: ${{ github.event_name == 'push' && vars.FORCE_MACOS_SIGNING_IDENTITY || '' }}
      FORCE_MACOS_CERT_SHA256: ${{ github.event_name == 'push' && vars.FORCE_MACOS_CERT_SHA256 || '' }}
      CSC_LINK: ${{ github.event_name == 'push' && vars.FORCE_RELEASE_MODE == 'official' && secrets.FORCE_MACOS_DEVELOPER_ID_P12_B64 || '' }}
      CSC_KEY_PASSWORD: ${{ github.event_name == 'push' && vars.FORCE_RELEASE_MODE == 'official' && secrets.FORCE_MACOS_DEVELOPER_ID_PASSWORD || '' }}
      APPLE_ID: ${{ github.event_name == 'push' && vars.FORCE_RELEASE_MODE == 'official' && secrets.FORCE_APPLE_ID || '' }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ github.event_name == 'push' && vars.FORCE_RELEASE_MODE == 'official' && secrets.FORCE_APPLE_APP_SPECIFIC_PASSWORD || '' }}
      APPLE_TEAM_ID: ${{ github.event_name == 'push' && vars.FORCE_RELEASE_MODE == 'official' && secrets.FORCE_APPLE_TEAM_ID || '' }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Check arm64 runner and release prerequisites
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(uname -m)" == arm64 ]]
          node scripts/force-release-policy.cjs
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
            [[ "$GITHUB_REF_NAME" == "v$(node -p 'require("./package.json").version')" ]]
            [[ "$FORCE_RELEASE_MODE" != adhoc ]] || { echo "Tag releases cannot use ad hoc signing" >&2; exit 1; }
          else
            [[ "$FORCE_RELEASE_MODE" == adhoc ]] || { echo "Manual builds must be ad hoc" >&2; exit 1; }
          fi
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tsunami/go.sum
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Check generated bindings and schema
        shell: bash
        run: |
          set -euo pipefail
          go run -mod=readonly cmd/generateschema/main-generateschema.go
          go run -mod=readonly cmd/generatets/main-generatets.go
          go run -mod=readonly cmd/generatego/main-generatego.go
          git diff --exit-code -- schema frontend/types/gotypes.d.ts frontend/types/waveevent.d.ts \
            frontend/app/store/services.ts frontend/app/store/wshclientapi.ts \
            pkg/wshrpc/wshclient/wshclient.go pkg/waveobj/metaconsts.go pkg/wconfig/metaconsts.go
      - name: Typecheck Electron and frontend
        run: npx tsc --noEmit
      - name: Test profile, updater and persistence guards
        run: npx vitest run emain/force-profile.test.ts emain/updater.test.ts frontend/app/store/update-guard.test.ts
      - name: Test Go update and isolation paths
        run: go test -mod=readonly ./pkg/wcloud ./cmd/server ./pkg/updateguard ./pkg/filestore ./pkg/secretstore ./pkg/wstore ./pkg/wshrpc/wshserver ./pkg/wavebase ./pkg/remote/... ./pkg/wshrpc/wshremote ./pkg/util/shellutil ./pkg/wslconn ./cmd/wsh/cmd
      - name: Validate release scripts
        run: node --test scripts/force-release*.test.mjs
      - name: Build macOS arm64
        run: bash scripts/force-build-mac.sh package
      - name: Validate app, signatures, feed and artifact hashes
        shell: bash
        run: bash scripts/force-verify-mac.sh "${{ github.event_name == 'push' && github.ref_name || '' }}"
      - name: Save manual ad hoc artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v5
        with:
          name: force-terminal-mac-arm64-adhoc
          path: |
            make/*.dmg
            make/*.zip
            make/*.blockmap
            make/latest-mac.yml
            make/force-release-manifest.json
          if-no-files-found: error
      - name: Create complete draft release
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/force-release.mjs verify --tag "$GITHUB_REF_NAME"
          gh release create "$GITHUB_REF_NAME" make/*.dmg make/*.zip make/*.blockmap make/latest-mac.yml make/force-release-manifest.json \
            --title "Force Terminal $GITHUB_REF_NAME" --generate-notes --draft --verify-tag
          gh api -H "Accept: application/vnd.github+json" "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" > "$RUNNER_TEMP/force-release.json"
          node scripts/force-release.mjs remote --assets "$RUNNER_TEMP/force-release.json" --tag "$GITHUB_REF_NAME"
          gh release edit "$GITHUB_REF_NAME" --draft=false
